cargo-tooltip=What this cannon sends. Slot 2 only accepts this item, so capsules can't end up in it; until you pick one, slot 2 is locked.
full-stack=Wait for a full stack
full-stack-tooltip=Fire only when the cargo slot holds a full stack, so no capsule is wasted on a half-empty load.
target-by-signal=Pick the target by signal:
target-by-signal-tooltip=The signal's value is a receiver's channel number; the cannon fires at that receiver. 0 = hold fire.
