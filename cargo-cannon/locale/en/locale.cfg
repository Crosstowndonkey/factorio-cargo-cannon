[mod-setting-description]
cargo-cannon-charge-rate=How fast a cannon draws power to charge for its next shot.
cargo-cannon-crash-damage=A capsule that can't be caught explodes; 1 = a grenade's blast, 0 = no damage (the cargo is still lost).
cargo-cannon-se-graphics=When Earendel's Space Exploration graphics mods are installed (space-exploration-graphics and space-exploration-graphics-5), the cannon, receiver, capsules and icons use his delivery cannon art. Does nothing without them.
