[entity-name]
cargo-cannon=Cargo cannon
cargo-cannon-receiver=Cargo receiver

[entity-description]
cargo-cannon=Fires one stack of cargo per shot in a capsule to a cargo receiver on another surface: a space platform in orbit, the planet below it, or - after research - another planet. Each shot needs capsules and a full charge of power. Slot 1 holds capsules, slot 2 the cargo you pick in its window. A capsule that lands on a full receiver, or where there is no receiver, explodes and its cargo is lost.
cargo-cannon-receiver=Catches capsules fired by cargo cannons. Give it a name and a channel in its window. Works like a passive provider chest for robots.

[item-name]
cargo-cannon=Cargo cannon
cargo-cannon-receiver=Cargo receiver
cargo-cannon-capsule=Cargo capsule

[item-description]
cargo-cannon-capsule=Carries one stack of cargo from a cargo cannon. Orbit shots use 1, interplanetary shots 3 (mod settings).

[virtual-signal-name]
cargo-cannon-receiver-space=Receiver space
cargo-cannon-charge=Cannon charge

[virtual-signal-description]
cargo-cannon-receiver-space=Sent by a cargo cannon: empty stacks in its target receiver, minus capsules already on their way. This is not the cargo receiver item.
cargo-cannon-charge=Sent by a cargo cannon: how charged it is for its next shot, in %.

[technology-name]
cargo-cannon=Cargo cannon
cargo-cannon-interplanetary=Interplanetary cargo

[technology-description]
cargo-cannon=Fire capsules of cargo between a planet and the space platforms above it.
cargo-cannon-interplanetary=Cargo cannons can fire across space to receivers on other planets. Costs much more power and capsules per shot, and the capsule takes a while to arrive.
cargo-cannon-interplanetary-effect=Cargo cannons can fire to other planets.

[cargo-cannon]
crashed-full=A cargo capsule hit a full receiver and exploded at __2__. Cargo lost: __1__
crashed-gone=A cargo capsule found no receiver and exploded at __2__. Cargo lost: __1__
missed-platform=A cargo capsule missed __2__: the platform had left orbit. Cargo lost: __1__
lost=A cargo capsule was lost: its destination no longer exists. Cargo lost: __1__
max-power=Max. charging power

