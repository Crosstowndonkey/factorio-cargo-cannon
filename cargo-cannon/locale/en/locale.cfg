condition-hint=To control firing, use Enable if in the Circuit connection panel. The cannon fires only while it's true, and robots stop loading it while it's false. Enable if Receiver space > 0 means no capsule will crash. A condition on one of these two signals always reads this cannon's own value.
no-special-target=The target signal must be a normal signal: its value is the receiver's channel.
